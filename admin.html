<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Panel — TOS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .user-list-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; }
    .user-info { display: flex; flex-direction: column; }
    .user-email { font-weight: 600; }
    .user-whatsapp { font-size: 12px; color: var(--accent); margin-top: 4px; }
    .user-date { font-size: 12px; color: var(--muted); }
    .switch { position: relative; display: inline-block; width: 50px; height: 28px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #334155; transition: .4s; border-radius: 34px; }
    .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--success); }
    input:checked + .slider:before { transform: translateX(22px); }
  </style>
</head>
<body>
  <div class="container" style="padding-bottom: 100px;">
    <div class="card static-page-card">
      <h1><i class="fa-solid fa-user-shield" style="color: var(--warning);"></i> Panel Admin</h1>
      <p class="subtitle">
        Kelola aktivasi pengguna.
      </p>

      <div id="admin-content">
        <!-- Konten akan dimuat oleh JavaScript -->
        <div class="loader-container">
          <div class="loader"><span></span><span></span><span></span></div>
          <p style="font-size:14px">Memuat data pengguna...</p>
        </div>
      </div>

    </div>
  </div>

  <nav class="bottom-nav">
    <a href="/index.html" class="nav-item"><i class="fa-solid fa-chart-simple"></i><span>Analisis</span></a>
    <a href="/riwayat.html" class="nav-item"><i class="fa-solid fa-clock-rotate-left"></i><span>Riwayat</span></a>
    <a href="/panduan.html" class="nav-item"><i class="fa-solid fa-book-open"></i><span>Panduan</span></a>
    <a href="/about.html" class="nav-item"><i class="fa-solid fa-user"></i><span>Tentang</span></a>
    <a href="/admin.html" id="admin-nav-link" class="nav-item active" style="color: var(--warning);"><i class="fa-solid fa-user-shield"></i><span>Admin</span></a>
  </nav>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
